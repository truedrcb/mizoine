openapi: 3.1.0
info:
  title: Mizoine
  description: "Personal knowledge base and file storage on plain files and Git. Every\
    \ page needs a login: browsers use the login form, other clients HTTP Basic. Public\
    \ without login: /favicon.ico and GET /ui/**, the static files of the user interface\
    \ (logos etc.). Those under /ui/ are not listed as operations: they are plain\
    \ files, not API methods. AI agents connect to the MCP endpoint /mcp (Model Context\
    \ Protocol, Streamable HTTP, POST with JSON-RPC): tools list_repositories, list_folder,\
    \ read_file, write_file, create_folder, delete, move, with the same grants as\
    \ this API. It is not listed as an operation either. Where the server has OAuth\
    \ set up, /mcp also takes Bearer tokens from Mizoine's own OAuth server for chat\
    \ apps: /.well-known/oauth-protected-resource/mcp (RFC 9728), /.well-known/oauth-authorization-server,\
    \ /oauth2/authorize and /oauth2/token (authorization code with PKCE, one registered\
    \ client per chat app). These are standard OAuth endpoints, not listed as operations\
    \ either."
  version: "1.0"
servers:
- url: /
  description: This Mizoine server
security:
- basicAuth: []
paths:
  /{repository}/{path}:
    get:
      tags:
      - Repositories
      summary: Folder or file of a repository
      description: "A folder (URL ending with '/') lists the subfolders and files\
        \ the user may see, sorted by name: an HTML page (default; folders and files\
        \ as links), or JSON when asked for. Hidden folders and files (starting with\
        \ '.' or containing '%') are not listed; above a granted folder only the way\
        \ down is shown, no files. A folder URL without '/' redirects. A file (URL\
        \ without '/') gives its content, whatever the Accept header asks for: type\
        \ from the name, ETag and Last-Modified (304 for If-None-Match), Range (206),\
        \ HEAD. For safety it is sent with 'Content-Security-Policy: sandbox', and\
        \ as download (attachment) unless its type cannot run in a browser. Exception:\
        \ a Markdown file (valid UTF-8, up to 2 MB) is a rendered HTML page when the\
        \ request asks explicitly for text/html (a browser), and neither '?raw' nor\
        \ an OAuth token (Bearer) is given; relative links and pictures work, headings\
        \ have GitHub-style ids for '#topic'."
      operationId: folder
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: Folder (ending with '/') or file below the repository root
        required: true
        schema:
          type: string
      - name: raw
        in: query
        description: "Markdown files: '?raw' gives the file itself, never the rendered\
          \ page"
      responses:
        "200":
          description: The folder page (HTML) or its subfolders and files (JSON);
            or the file's content
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
            '*/*': {}
        "206":
          description: Part of a file (Range)
        "304":
          description: "File not modified (If-None-Match, If-Modified-Since)"
        "302":
          description: "Folder URL without trailing slash: redirect to the same URL\
            \ with '/' (only for folders the user may see); or Browser not logged\
            \ in: redirect to the login page"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository or folder, or no access to it — deliberately\
            \ the same answer"
        "406":
          description: Neither text/html nor application/json accepted (folders only)
        "500":
          description: Repository configured wrongly (e.g. missing root folder); the
            file to fix and the problems only for users with access to the whole repository
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryProblem"
    put:
      tags:
      - Repositories
      summary: "Create or replace a file, or create a folder"
      description: "A folder URL (ending with '/', empty body) creates the folder;\
        \ it exists already → 204. A file URL: the request body is the new content,\
        \ stored exactly as sent. Atomic: readers see the old or the new content,\
        \ never a part. The folder must exist (folders are created explicitly). If-Match:\
        \ <ETag> writes only if the file is unchanged since it was read; If-None-Match:\
        \ * creates only. API clients with an Authorization header need no CSRF token;\
        \ the browser UI (session cookie) sends X-XSRF-TOKEN."
      operationId: put
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: "File below the repository root; or a folder, ending with '/'"
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: "Files: the ETag the file must still have"
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: "'*': create only"
        required: false
        schema:
          type: string
      responses:
        "201":
          description: Created; Location (and for files the ETag)
        "204":
          description: "File replaced (ETag of the new content), or folder exists\
            \ already"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "403":
          description: Browser session without CSRF token
        "404":
          description: "Unknown repository or path, no write access, or a hidden name\
            \ — deliberately the same answer"
        "409":
          description: The parent folder does not exist; a folder or file is in the
            way; or the repository root
        "412":
          description: If-Match or If-None-Match not met; nothing written
        "413":
          description: Larger than the server's maximum file size; nothing written
        "415":
          description: A folder URL with a request body
        "500":
          description: Repository configured wrongly
    post:
      tags:
      - Repositories
      summary: Move or rename a file or a folder
      description: "The Destination header names the new place: a path on this server\
        \ in the same repository, e.g. /notes/archive/plan.md, encoded like a URL;\
        \ folders end with '/' in both. WebDAV MOVE semantics on POST. A folder moves\
        \ with everything in it, in one atomic step. Never overwrites; the destination's\
        \ folder must exist. If-Match: <ETag> moves a file only if unchanged. Not\
        \ the repository root or a granted folder. API clients and the browser UI\
        \ need no CSRF token for it (a cross-site form cannot send a Destination header)."
      operationId: move
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: "File; or folder, ending with '/'"
        required: true
        schema:
          type: string
      - name: Destination
        in: header
        description: "New path on this server, e.g. /notes/archive/plan.md"
        required: false
        schema:
          type: string
      - name: If-Match
        in: header
        description: "Files: the ETag the file must still have"
        required: false
        schema:
          type: string
      responses:
        "201":
          description: Moved; Location of the new place
        "400":
          description: "No Destination, or not a path in this repository, or a folder\
            \ URL for a file (or the other way round)"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "403":
          description: "Browser session: POST without Destination (CSRF)"
        "404":
          description: "Unknown repository or path, no write access, or a hidden name\
            \ — deliberately the same answer; for the source or the destination"
        "409":
          description: The destination's folder does not exist; a folder into itself;
            the repository root or a granted folder; source and destination on different
            file systems
        "412":
          description: "The destination exists (never overwritten), or If-Match not\
            \ met"
        "500":
          description: Repository configured wrongly
    delete:
      tags:
      - Repositories
      summary: Delete a file or an empty folder
      description: "A file URL deletes the file, a folder URL (ending with '/') an\
        \ empty folder. A folder with content, also hidden content such as .git, is\
        \ never deleted (409); nor the repository root or the user's own granted folder.\
        \ If-Match: <ETag> deletes a file only if unchanged. A symbolic link is removed,\
        \ never its target."
      operationId: delete
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: "File; or folder, ending with '/'"
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: "Files: the ETag the file must still have"
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "403":
          description: Browser session without CSRF token
        "404":
          description: "Unknown repository or path, no write access, or a hidden name\
            \ — deliberately the same answer; or a folder URL for a file, or the other\
            \ way round"
        "409":
          description: Folder not empty; or the repository root or a granted folder
        "412":
          description: If-Match not met; nothing deleted
        "500":
          description: Repository configured wrongly
  /{repository}/.git/unstage:
    post:
      tags:
      - Git
      summary: Unstage changes
      description: "Takes staged files out of the next commit (git restore --staged);\
        \ their changes stay in the working tree. A renamed file is unstaged with\
        \ its old name. Either 'paths' (one or more, as the status names them) or\
        \ 'all': true."
      operationId: gitUnstage
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionRequest"
        required: true
      responses:
        "200":
          description: Unstaged; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          description: "Either 'paths' (one or more, as the status names them) or\
            \ 'all': true"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no Git access to it: deliberately the\
            \ same answer"
        "409":
          description: "Not done: not a Git repository, a file not among the changes,\
            \ nothing to do, or Git refused; the message says why"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "500":
          description: Repository configured wrongly (e.g. missing root folder); or
            Git failed
  /{repository}/.git/stage:
    post:
      tags:
      - Git
      summary: Stage changes
      description: "Stages changed, new or deleted files for the next commit (git\
        \ add). Only files of the current status can be named; conflicts are resolved\
        \ by hand on the server. Either 'paths' (one or more, as the status names\
        \ them) or 'all': true."
      operationId: gitStage
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionRequest"
        required: true
      responses:
        "200":
          description: Staged; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          description: "Either 'paths' (one or more, as the status names them) or\
            \ 'all': true"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no Git access to it: deliberately the\
            \ same answer"
        "409":
          description: "Not done: not a Git repository, a file not among the changes,\
            \ nothing to do, or Git refused; the message says why"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "500":
          description: Repository configured wrongly (e.g. missing root folder); or
            Git failed
  /{repository}/.git/push:
    post:
      tags:
      - Git
      summary: Push to the upstream
      description: "Pushes the current branch to its upstream branch only, never forced:\
        \ a push that is behind is rejected (pull first). The remote is reached with\
        \ the server's own Git credentials. Send Content-Type: application/json; the\
        \ body may be empty."
      operationId: gitPush
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Pushed; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no Git access to it: deliberately the\
            \ same answer"
        "409":
          description: "Not done: not a Git repository, a file not among the changes,\
            \ nothing to do, or Git refused; the message says why (e.g. no upstream,\
            \ rejected)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "500":
          description: Repository configured wrongly (e.g. missing root folder); or
            Git failed
        "504":
          description: The remote did not answer within the time limit; Git was ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /{repository}/.git/pull:
    post:
      tags:
      - Git
      summary: Pull from the upstream
      description: "Fast-forwards the current branch to its upstream (git pull --ff-only),\
        \ never a merge or a rebase: a branch that has diverged is refused, to be\
        \ resolved by hand on the server. Mizoine's own file writes wait while it\
        \ runs. The remote is reached with the server's own Git credentials. Send\
        \ Content-Type: application/json; the body may be empty."
      operationId: gitPull
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Pulled; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no Git access to it: deliberately the\
            \ same answer"
        "409":
          description: "Not done: not a Git repository, a file not among the changes,\
            \ nothing to do, or Git refused; the message says why (e.g. no upstream,\
            \ diverged)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "500":
          description: Repository configured wrongly (e.g. missing root folder); or
            Git failed
        "504":
          description: The remote did not answer within the time limit; Git was ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /{repository}/.git/commit:
    post:
      tags:
      - Git
      summary: Commit the staged changes
      description: "Commits what is staged (git commit), with the logged-in user as\
        \ author (name, and the email from the users file, else <name>@mizoine); the\
        \ committer is the server's own Git identity. The repository's hooks run as\
        \ with a commit by hand."
      operationId: gitCommit
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
        required: true
      responses:
        "200":
          description: Committed; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          description: No message
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no Git access to it: deliberately the\
            \ same answer"
        "409":
          description: "Not done: not a Git repository, a file not among the changes,\
            \ nothing to do, or Git refused; the message says why (e.g. nothing staged,\
            \ a hook refused)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "500":
          description: Repository configured wrongly (e.g. missing root folder); or
            Git failed
  /{repository}:
    get:
      tags:
      - Repositories
      summary: Repository without trailing slash
      description: "Redirects to the same URL with a trailing slash (folder URLs end\
        \ with '/'). Done for every valid name, so it reveals nothing about which\
        \ repositories exist."
      operationId: repositoryRedirect
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      responses:
        "302":
          description: "Redirect to /{repository}/; or Browser not logged in: redirect\
            \ to the login page"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: Not a valid repository name
  /{repository}/.search:
    get:
      tags:
      - Search
      summary: Search in a repository
      description: "Finds files and folders by their names, and text files by their\
        \ content, among those the user may read; best first. Words are found in every\
        \ spelling of a letter (German ä = ae = a, ß = ss, accents, French elision,\
        \ Russian ё = е) and in their word forms (English, German, French, Russian\
        \ by default). A query: words, \"a phrase\", -leftout, prefix*; at most 200\
        \ characters. All words first; if nothing is found, any of them; then words\
        \ of a similar spelling: strictness says which. Email addresses and file names\
        \ are found whole and by their parts. An HTML page (default; without q the\
        \ search box) or JSON when asked for. Every answer gives the state of each\
        \ searched repository's index."
      operationId: searchRepository
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      - name: q
        in: query
        description: "What to find: words, \"a phrase\", -leftout, prefix*"
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "How many results, 1 to 100"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: offset
        in: query
        description: "From which result, from 0"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: "The results: an HTML page, or JSON"
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "302":
          description: "Browser not logged in: redirect to the login page"
        "400":
          description: "q is missing, empty, too long or only leaves out; or limit\
            \ or offset is wrong; the message says which"
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or one the user has no grant in"
        "500":
          description: "The repository is configured wrongly, or the index could not\
            \ be read"
        "503":
          description: "None of the searched repositories has a search index to answer\
            \ from; the states say why (e.g. not-indexed: to be built)"
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailable"
  /{repository}/.git:
    get:
      tags:
      - Git
      summary: Git page without trailing slash
      description: "Redirects to /{repository}/.git/ for users with Git access (folder\
        \ URLs end with '/')."
      operationId: gitRedirect
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      responses:
        "302":
          description: "Redirect to /{repository}/.git/; or Browser not logged in:\
            \ redirect to the login page"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no Git access to it: deliberately the\
            \ same answer"
        "500":
          description: Repository configured wrongly (e.g. missing root folder); or
            Git failed
  /{repository}/.git/:
    get:
      tags:
      - Git
      summary: Git status of a repository
      description: "The Git status: branch, upstream with ahead and behind, the staged\
        \ and the not staged changes, conflicts; an HTML page (default) or JSON when\
        \ asked for. File names link to their pages where the user may read them.\
        \ Only for users with Git access: grant '.git' or '/' in the repository file;\
        \ the status covers the whole repository. A repository whose folder is not\
        \ the top of a Git working tree has no status: the page says so, JSON gives\
        \ 409."
      operationId: gitStatus
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The Git page, or the status as JSON"
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "302":
          description: "Browser not logged in: redirect to the login page"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no Git access to it: deliberately the\
            \ same answer"
        "409":
          description: The repository's folder is not the top of a Git working tree
            (JSON only)
        "500":
          description: Repository configured wrongly (e.g. missing root folder); or
            Git failed
  /:
    get:
      tags:
      - Start page
      summary: "Start page: the user's repositories"
      description: "Greets the logged-in user and lists the repositories they can\
        \ access, sorted by name: an HTML page with links (default), or JSON when\
        \ asked for. Without repositories the page says \"No accessible repositories\
        \ configured for you.\" and the JSON list is empty."
      operationId: startPage
      responses:
        "200":
          description: The start page (HTML) or the user's repositories (JSON)
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/StartPage"
        "302":
          description: "Browser not logged in: redirect to the login page"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "406":
          description: Neither text/html nor application/json accepted
  /.search:
    get:
      tags:
      - Search
      summary: Search in all repositories
      description: "Finds files and folders by their names, and text files by their\
        \ content, among those the user may read; best first. Words are found in every\
        \ spelling of a letter (German ä = ae = a, ß = ss, accents, French elision,\
        \ Russian ё = е) and in their word forms (English, German, French, Russian\
        \ by default). A query: words, \"a phrase\", -leftout, prefix*; at most 200\
        \ characters. All words first; if nothing is found, any of them; then words\
        \ of a similar spelling: strictness says which. Email addresses and file names\
        \ are found whole and by their parts. An HTML page (default; without q the\
        \ search box) or JSON when asked for. Every answer gives the state of each\
        \ searched repository's index. Searches every repository the user may read\
        \ in, results of all in one order."
      operationId: searchAllRepositories
      parameters:
      - name: q
        in: query
        description: "What to find: words, \"a phrase\", -leftout, prefix*"
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "How many results, 1 to 100"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: offset
        in: query
        description: "From which result, from 0"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: "The results: an HTML page, or JSON"
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "302":
          description: "Browser not logged in: redirect to the login page"
        "400":
          description: "q is missing, empty, too long or only leaves out; or limit\
            \ or offset is wrong; the message says which"
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "500":
          description: "The repository is configured wrongly, or the index could not\
            \ be read"
        "503":
          description: "None of the searched repositories has a search index to answer\
            \ from; the states say why (e.g. not-indexed: to be built)"
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailable"
components:
  schemas:
    SelectionRequest:
      type: object
      properties:
        paths:
          type: array
          description: "Paths as the status names them, from the repository root"
          items:
            type: string
        all:
          type: boolean
          description: "true: every file of the list instead"
    Change:
      type: object
      properties:
        path:
          type: string
          description: "From the repository root, with '/'"
        renamedFrom:
          type:
          - string
          - "null"
          description: The old path of a renamed or copied file; null otherwise
        staged:
          type: string
          description: "The change in the index: what the next commit takes"
          enum:
          - UNCHANGED
          - MODIFIED
          - TYPE_CHANGED
          - ADDED
          - DELETED
          - RENAMED
          - COPIED
          - UNTRACKED
          - CONFLICT
        unstaged:
          type: string
          description: "The change in the working tree, not staged yet"
          enum:
          - UNCHANGED
          - MODIFIED
          - TYPE_CHANGED
          - ADDED
          - DELETED
          - RENAMED
          - COPIED
          - UNTRACKED
          - CONFLICT
    GitStatus:
      type: object
      description: "The Git status of a repository, as 'git status' gives it"
      properties:
        branch:
          type:
          - string
          - "null"
          description: The current branch; null for a detached HEAD
        hasCommits:
          type: boolean
          description: false before the first commit
        upstream:
          $ref: "#/components/schemas/Upstream"
          description: The branch it pulls from and pushes to; null if none is set
        changes:
          type: array
          description: "The changed files in Git's order; paths from the repository\
            \ root, with '/'"
          items:
            $ref: "#/components/schemas/Change"
        clean:
          type: boolean
          description: Nothing to commit and nothing changed
    Upstream:
      type: object
      properties:
        name:
          type: string
          description: e.g. origin/main
        gone:
          type: boolean
          description: The upstream branch no longer exists; ahead and behind are
            then 0
        ahead:
          type: integer
          format: int32
          description: Commits here that the upstream does not have
        behind:
          type: integer
          format: int32
          description: "Commits in the upstream that are not here: pull first"
    Refusal:
      type: object
      properties:
        message:
          type: string
          description: "Why, for the user"
    CommitRequest:
      type: object
      properties:
        message:
          type: string
          description: The commit message; not empty
    FolderListing:
      type: object
      description: The subfolders and files of a folder that the user may see
      properties:
        repository:
          type: string
          description: Repository name
        path:
          type: string
          description: "The folder, from the repository root, with leading and trailing\
            \ '/' ('/' = the root)"
        folders:
          type: array
          description: "Names of the visible subfolders, sorted"
          items:
            type: string
        files:
          type: array
          description: "Names of the visible files, sorted; none in folders above\
            \ a granted folder"
          items:
            type: string
    RepositoryProblem:
      type: object
      description: A repository that is configured wrongly
      properties:
        repository:
          type: string
          description: Repository name
        error:
          type: string
          description: Always 'repository not available'
        file:
          type: string
          description: The repository file to fix; only for users with access to the
            whole repository
        problems:
          type: array
          description: What is wrong; only for users with access to the whole repository
          items:
            type: string
    Hit:
      type: object
      description: A found file or folder
      properties:
        repository:
          type: string
        path:
          type: string
        url:
          type: string
          description: Its page
        kind:
          type: string
          description: file or folder
        title:
          type: string
        snippets:
          type: array
          description: Up to 3 passages of a text file with the found words
          items:
            $ref: "#/components/schemas/Snippet"
    IndexInfo:
      type: object
      description: The search index of a searched repository
      properties:
        repository:
          type: string
        status:
          type: string
          description: "not-indexed, needs-reindexing, reindexing, indexed or failed"
          enum:
          - not-indexed
          - needs-reindexing
          - reindexing
          - indexed
          - failed
        reason:
          type: string
          description: "Why: format or damaged (needs-reindexing), or what went wrong\
            \ (failed)"
        searchable:
          type: boolean
          description: "Whether its results are in the answer: from the current index,\
            \ or an older one"
    Part:
      type: object
      properties:
        text:
          type: string
        match:
          type: boolean
    SearchResults:
      type: object
      description: "Search results, best first"
      properties:
        query:
          type: string
        strictness:
          type: string
          description: "all-words, any-word, similar-spelling (each tried only if\
            \ the stricter found nothing) or none"
          enum:
          - all-words
          - any-word
          - similar-spelling
          - none
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        hits:
          type: array
          items:
            $ref: "#/components/schemas/Hit"
        indexes:
          type: array
          description: The index state of each searched repository
          items:
            $ref: "#/components/schemas/IndexInfo"
    Snippet:
      type: object
      description: "A passage of the file; joined, the parts give the text; found\
        \ words have match true"
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/Part"
    Unavailable:
      type: object
      properties:
        message:
          type: string
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/IndexInfo"
    Repository:
      type: object
      properties:
        name:
          type: string
          description: "Repository name, also its URL: /{name}/"
        available:
          type: boolean
          description: false if the repository is configured wrongly
        problems:
          type: array
          description: "What is wrong; only for users with access to the whole repository,\
            \ otherwise left out"
          items:
            type: string
    StartPage:
      type: object
      description: The logged-in user and the repositories they can access
      properties:
        user:
          type: string
          description: Username of the logged-in user
        repositories:
          type: array
          description: Sorted by name; empty without access to any repository
          items:
            $ref: "#/components/schemas/Repository"
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
