openapi: 3.1.0
info:
  title: Mizoine
  description: "Personal knowledge base and file storage on plain files and Git. Every\
    \ page needs a login: browsers use the login form, other clients HTTP Basic."
  version: "1.0"
servers:
- url: /
  description: This Mizoine server
security:
- basicAuth: []
paths:
  /{repository}:
    get:
      tags:
      - Repositories
      summary: Repository without trailing slash
      description: "Redirects to the same URL with a trailing slash (folder URLs end\
        \ with '/'). Done for every valid name, so it reveals nothing about which\
        \ repositories exist."
      operationId: withoutTrailingSlash
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      responses:
        "302":
          description: "Redirect to /{repository}/"
        "401":
          description: Not logged in
        "404":
          description: Not a valid repository name
  /{repository}/:
    get:
      tags:
      - Repositories
      summary: Repository
      description: Answers 'ok' when the repository exists and the user has access
        to it.
      operationId: repository
      parameters:
      - name: repository
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The repository page
          content:
            text/html: {}
        "302":
          description: "Browser not logged in: redirect to the login page"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "404":
          description: "Unknown repository, or no access to it — deliberately the\
            \ same answer"
        "406":
          description: Only text/html is available
        "500":
          description: Repository configured wrongly (e.g. missing root folder); details
            only for users with access to the whole repository
          content:
            text/html: {}
  /:
    get:
      tags:
      - Start page
      summary: "Start page: the user's repositories"
      description: "Greets the logged-in user and lists the repositories they can\
        \ access, sorted by name: an HTML page with links (default), or JSON when\
        \ asked for. Without repositories the page says \"No accessible repositories\
        \ configured for you.\" and the JSON list is empty."
      operationId: startPage
      responses:
        "200":
          description: The start page (HTML) or the user's repositories (JSON)
          content:
            text/html: {}
            application/json:
              schema:
                $ref: "#/components/schemas/StartPage"
        "302":
          description: "Browser not logged in: redirect to the login page"
        "401":
          description: "Not logged in (non-browser clients): HTTP Basic challenge"
        "406":
          description: Neither text/html nor application/json accepted
components:
  schemas:
    Repository:
      type: object
      properties:
        name:
          type: string
        available:
          type: boolean
        problems:
          type: array
          items:
            type: string
    StartPage:
      type: object
      properties:
        user:
          type: string
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
