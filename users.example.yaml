# Users who may log in to Mizoine. Copy to users.yaml and edit; changes take effect without a restart.
#
# - username: case-sensitive ("alice" and "Alice" are different users)
# - password: a BCrypt hash, never the password itself. Create one with:
#     java -jar mizoine.jar hash-password
#
# - email: optional; the author address of your Git commits from the Git page
#
# The hash below belongs to a random password nobody knows: replace it.
users:
